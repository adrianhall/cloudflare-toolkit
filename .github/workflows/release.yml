name: Release

on:
  push:
    tags:
      - "v*.*.*"

# Release tags are created serially by maintainers. Serializing the pipeline prevents two valid
# versions from racing each other at npm or GitHub Pages; an in-progress release is never cancelled.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Fetch main
        run: git fetch --no-tags origin +main:refs/remotes/origin/main

      - name: Validate tag, versions, and ancestry
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const tag = process.env.TAG;
          const stableTag = /^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/;
          if (!stableTag.test(tag)) {
            throw new Error(`Release tag must be stable semver vX.Y.Z; received ${tag}`);
          }

          const packageJson = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const packageLock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
          const packageName = "@adrianhall/cloudflare-toolkit";
          if (packageJson.name !== packageName) {
            throw new Error(`package.json name must be ${packageName}`);
          }
          if (packageLock.name !== packageName || packageLock.packages?.[""]?.name !== packageName) {
            throw new Error("package-lock.json package names do not match package.json");
          }
          const expectedTag = `v${packageJson.version}`;
          if (tag !== expectedTag) {
            throw new Error(`Tag ${tag} does not match package.json version ${expectedTag}`);
          }
          if (packageLock.version !== packageJson.version) {
            throw new Error("package-lock.json top-level version does not match package.json");
          }
          if (packageLock.packages?.[""]?.version !== packageJson.version) {
            throw new Error('package-lock.json packages[""] version does not match package.json');
          }
          NODE
          if [ "$(git cat-file -t "refs/tags/$TAG")" != "tag" ]; then
            echo "Release tag $TAG must be annotated" >&2
            exit 1
          fi
          TAGGED_SHA=$(git rev-parse "refs/tags/$TAG^{commit}")
          git merge-base --is-ancestor "$TAGGED_SHA" origin/main || {
            echo "Tagged commit $TAGGED_SHA is not contained in origin/main" >&2
            exit 1
          }

      - name: Validate release notes
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          const version = require("./package.json").version;
          const lines = fs.readFileSync("CHANGELOG.md", "utf8").split("\n");
          const heading = `## ${version}`;
          const start = lines.findIndex((line) => line.trim() === heading);
          if (start < 0) throw new Error(`CHANGELOG.md has no ${heading} entry`);
          const next = lines.findIndex((line, index) => index > start && line.startsWith("## "));
          const notes = lines.slice(start + 1, next < 0 ? undefined : next).join("\n").trim();
          if (!notes) throw new Error(`${heading} has no release notes`);
          NODE

      - name: Validate npm registry state
        env:
          PACKAGE_NAME: "@adrianhall/cloudflare-toolkit"
        run: |
          npm view "$PACKAGE_NAME" versions --json > "$RUNNER_TEMP/npm-versions.json"
          node <<'NODE'
          const fs = require("node:fs");

          const candidate = require("./package.json").version;
          const raw = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/npm-versions.json`, "utf8"));
          const versions = (Array.isArray(raw) ? raw : [raw]).filter(Boolean);
          const stable = /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/;
          const parse = (version) => version.split(".").map(BigInt);
          const compare = (left, right) => {
            const a = parse(left);
            const b = parse(right);
            for (let index = 0; index < 3; index += 1) {
              if (a[index] < b[index]) return -1;
              if (a[index] > b[index]) return 1;
            }
            return 0;
          };
          const published = versions.filter((version) => stable.test(version));

          if (published.some((version) => compare(version, candidate) > 0)) {
            throw new Error(`${candidate} is older than an already-published stable version`);
          } else if (versions.includes(candidate)) {
            console.log(`${candidate} is already published; a rerun will skip npm publish.`);
          } else {
            console.log(`${candidate} is an unpublished, newer stable version.`);
          }
          NODE

      - name: Install root dependencies
        run: npm ci

      - name: Check
        run: npm run check

      - name: Test with coverage
        run: npm run test:coverage

      - name: Install docs dependencies
        run: npm ci
        working-directory: docs

      - name: Build docs (TypeDoc + VitePress)
        run: npm run docs:build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/.vitepress/dist
          retention-days: 7

  # npm Trusted Publishing is bound to this filename and environment. The exact-version check
  # makes reruns safe when npm succeeded but a later Pages or GitHub Release step failed.
  publish:
    needs: validate
    runs-on: ubuntu-latest
    environment: release-gate
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v7

      - name: Setup Node.js for npm Trusted Publishing
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build fresh package
        run: npm run build

      - name: Publish or confirm exact version
        env:
          PACKAGE_NAME: "@adrianhall/cloudflare-toolkit"
        run: |
          VERSION=$(node -p "require('./package.json').version")
          npm view "$PACKAGE_NAME" versions --json > "$RUNNER_TEMP/npm-versions.json"
          VERSION="$VERSION" node <<'NODE'
          const fs = require("node:fs");

          const candidate = process.env.VERSION;
          const raw = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/npm-versions.json`, "utf8"));
          const versions = (Array.isArray(raw) ? raw : [raw]).filter(Boolean);
          const stable = /^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/;
          const parse = (version) => version.split(".").map(BigInt);
          const newerExists = versions.filter((version) => stable.test(version)).some((version) => {
            const published = parse(version);
            const local = parse(candidate);
            for (let index = 0; index < 3; index += 1) {
              if (published[index] < local[index]) return false;
              if (published[index] > local[index]) return true;
            }
            return false;
          });
          if (newerExists) {
            throw new Error(`${candidate} is older than an already-published stable version`);
          }
          NODE
          ERROR_FILE="$RUNNER_TEMP/npm-view-error.txt"
          if PUBLISHED=$(npm view "$PACKAGE_NAME@$VERSION" version --json 2>"$ERROR_FILE"); then
            if [ "$(node -p "JSON.parse(process.argv[1])" "$PUBLISHED")" != "$VERSION" ]; then
              echo "Registry returned an unexpected version for $PACKAGE_NAME@$VERSION" >&2
              exit 1
            fi
            echo "$PACKAGE_NAME@$VERSION is already published; continuing the release rerun."
          elif grep -qE 'E404|404 Not Found' "$ERROR_FILE"; then
            npm publish --access public --provenance
          else
            cat "$ERROR_FILE" >&2
            exit 1
          fi

  deploy-docs:
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  github-release:
    needs: deploy-docs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Create GitHub Release if absent
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          VERSION=${TAG#v}
          VERSION="$VERSION" node <<'NODE'
          const fs = require("node:fs");

          const lines = fs.readFileSync("CHANGELOG.md", "utf8").split("\n");
          const heading = `## ${process.env.VERSION}`;
          const start = lines.findIndex((line) => line.trim() === heading);
          if (start < 0) throw new Error(`CHANGELOG.md has no ${heading} entry`);
          const next = lines.findIndex((line, index) => index > start && line.startsWith("## "));
          const notes = lines.slice(start + 1, next < 0 ? undefined : next).join("\n").trim();
          if (!notes) throw new Error(`${heading} has no release notes`);
          fs.writeFileSync(`${process.env.RUNNER_TEMP}/release-notes.md`, `${notes}\n`);
          NODE
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists; nothing to create."
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$TAG" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
